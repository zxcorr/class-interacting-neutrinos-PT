# ========================================================
# NUWA baseline .ini file
# 
# A. Marins adaption from github.com/davidcato/class-interacting-neutrinos-PT (by D. Camarena)
# to CLASS 3.3.4
# ========================================================

# --------------------------------------------------------
# Paths (required until input.c default fix is applied)
# --------------------------------------------------------
base_path = /data2/NUWA_classpt
interacting_Cl_file_new = /data2/NUWA_classpt/neutrinos_collision_terms/Coll_integrals_11_qbins.dat
interacting_Cl_file_syn = /data2/NUWA_classpt/neutrinos_collision_terms/Coll_integrals_5_qbins.dat
interacting_alphal_file = /data2/NUWA_classpt/neutrinos_collision_terms/Massless_alpha_l.dat

# --------------------------------------------------------
# Standard cosmological parameters (Planck 2018 best-fit)
# --------------------------------------------------------
h = 0.6736
T_cmb = 2.7255
omega_b = 0.02237
omega_cdm = 0.1200
Omega_k = 0.
Omega_fld = 0.

# --------------------------------------------------------
# Neutrino sector
# standard: N_eff=3.044
# --------------------------------------------------------
# Option 1: 
N_ur = 0.004411
N_ncdm = 1
m_ncdm = 0.06          # eV; degenerate mass
T_ncdm = 0.71611       # T_ncdm/T_gamma (default)
deg_ncdm = 3.0

# Option 2 (comment out option 1, uncomment this):
# three degenerate massive, no massless
# N_ur = 0.00441
# N_ncdm = 3
# m_ncdm = 0.02, 0.02, 0.02
# T_ncdm = 0.71611, 0.71611, 0.71611
# deg_ncdm = 1.0, 1.0, 1.0

# --------------------------------------------------------
# Neutrino self-interaction (set log10_G_eff_nu < -6 for LCDM)
# --------------------------------------------------------
log10_G_eff_nu = -3.0   
#effectively LCDM (G_eff=0); -2.0 for SI

# --------------------------------------------------------
# Primordial power spectrum
# --------------------------------------------------------
n_s = 0.9649
A_s = 2.101e-9
k_pivot = 0.05          # Mpc^-1

# --------------------------------------------------------
# Output
# --------------------------------------------------------
output = tCl, pCl, lCl, mPk
l_max_scalars = 3000
P_k_max_h/Mpc = 1.0
z_pk = 0.

# --------------------------------------------------------
# Precision (increase for publication-quality runs)
# --------------------------------------------------------
gauge = synchronous
k_per_decade_for_pk = 10
k_per_decade_for_bao = 70

# Neutrino TCA precision (only active when log10_G_eff_nu > -6)
# tight_coupling_trigger_tau_nu_over_tau_h = 0.001
# tight_coupling_trigger_tau_nu_over_tau_k = 0.001
# full_hierarchy_trigger_tau_nu_over_tau_k = 1.e4
# start_small_k_at_tau_nu_over_tau_h = 2.e-5

background_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 3
bessels_verbose = 1
transfer_verbose = 1
primordial_verbose = 1
spectra_verbose = 1
nonlinear_verbose = 1
nonlinear_pt_verbose = 1
lensing_verbose = 1
output_verbose = 1

# --------------------------------------------------------
# Optional: output files
# --------------------------------------------------------
root = output/SInu_nuwa_test
# overwrite_root = yes